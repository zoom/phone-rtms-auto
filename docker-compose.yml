services:
  # Redis for session storage and OAuth token persistence
  redis:
    image: redis:7-alpine
    container_name: zp-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - zp-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API server (port 3001 - for ngrok)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zp-backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - BACKEND_PORT=3001
      - ZOOM_APP_CLIENT_ID=${ZOOM_APP_CLIENT_ID}
      - ZOOM_APP_CLIENT_SECRET=${ZOOM_APP_CLIENT_SECRET}
      - ZOOM_HOST=${ZOOM_HOST:-https://zoom.us}
      - ZOOM_SECRET_TOKEN=${ZOOM_SECRET_TOKEN}
      - PUBLIC_URL=${PUBLIC_URL}
      - FRONTEND_URL=${PUBLIC_URL}
      - FRONTEND_INTERNAL_URL=http://frontend:3000
      - RTMS_SERVER_URL=http://rtms:3002
      - ZOOM_REDIRECT_URL=${ZOOM_REDIRECT_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-development}

    volumes:
      # Mount source code for hot reload
      - ./backend:/app:delegated
      # Prevent overwriting node_modules
      - backend-node-modules:/app/node_modules
      # Mount shared .env file
      - ./.env:/app/../.env:ro
    networks:
      - zp-network
    command: ["npx", "nodemon", "server.js"]
    depends_on:
      redis:
        condition: service_healthy
      frontend:
        condition: service_started
      rtms:
        condition: service_started

  # Internal RTMS session service; Zoom webhooks enter through the backend.
  rtms:
    build:
      context: ./rtms
      dockerfile: Dockerfile
    container_name: zp-rtms
    environment:
      - RTMS_PORT=3002
      - BACKEND_INTERNAL_URL=http://backend:3001
      - SESSION_SECRET=${SESSION_SECRET}
      - RTMS_ZOOM_CLIENT_ID=${RTMS_ZOOM_CLIENT_ID:-${ZOOM_APP_CLIENT_ID}}
      - RTMS_ZOOM_CLIENT_SECRET=${RTMS_ZOOM_CLIENT_SECRET:-${ZOOM_APP_CLIENT_SECRET}}
    volumes:
      - ./rtms:/app:delegated
      - rtms-node-modules:/app/node_modules
      - ./.env:/app/../.env:ro
    networks:
      - zp-network
    command: ["npx", "nodemon", "server.js"]

  # Frontend React dev server (port 3000 - internal only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zp-frontend
    # No external port mapping - accessed through backend proxy
    environment:
      - VITE_BACKEND_URL=/api
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      # Prevent overwriting node_modules
      - frontend-node-modules:/app/node_modules
    networks:
      - zp-network
    stdin_open: true
    tty: true


networks:
  zp-network:
    driver: bridge

volumes:
  frontend-node-modules:
  backend-node-modules:
  rtms-node-modules:
  redis-data:
